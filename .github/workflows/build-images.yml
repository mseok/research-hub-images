name: Build and Push Research Hub Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docker/Dockerfile.research-hub"
      - "docker/hub-entrypoint.sh"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-research-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ghcr.io/mseok/research-hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.research-hub
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mseok/research-hub:v1
            ghcr.io/mseok/research-hub:latest
